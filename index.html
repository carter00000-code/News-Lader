<style>
:root {
  --bg: #0a0a0a;
  --bg2: #141414;
  --bg3: #1c1c1c;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.15);
  --text: #f0ede8;
  --text2: #999;
  --text3: #555;
  --accent: #c8a96e;
  --accent2: #8fb8d4;
  --red: #e05a5a;
  --green: #5aad7a;
  --serif: 'Noto Serif TC', serif;
  --sans: 'Noto Sans TC', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); overflow-x: hidden; }

/* ── App shell ── */
.app { display: flex; flex-direction: column; height: 100dvh; max-width: 430px; margin: 0 auto; }

/* ── Header ── */
.header {
  padding: 52px 20px 16px;
  background: var(--bg);
  border-bottom: 0.5px solid var(--border);
  position: relative;
  flex-shrink: 0;
}
.header-top { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 14px; }
.brand { font-family: var(--serif); font-size: 26px; font-weight: 700; letter-spacing: 0.04em; color: var(--text); }
.brand span { color: var(--accent); }
.live-dot { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text3); letter-spacing: 0.08em; text-transform: uppercase; }
.live-dot::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--red); animation: blink 1.8s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* ── Search ── */
.search-wrap { position: relative; }
.search-input {
  width: 100%; background: var(--bg3); border: 0.5px solid var(--border2);
  border-radius: 10px; padding: 11px 44px 11px 16px;
  font-family: var(--sans); font-size: 15px; color: var(--text);
  outline: none; transition: border-color 0.2s;
}
.search-input::placeholder { color: var(--text3); }
.search-input:focus { border-color: var(--accent); }
.search-btn {
  position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
  background: var(--accent); border: none; border-radius: 7px;
  width: 36px; height: 30px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: #0a0a0a;
}
.search-btn svg { width: 15px; height: 15px; }

/* ── Chips ── */
.chips-wrap { flex-shrink: 0; background: var(--bg); border-bottom: 0.5px solid var(--border); }
.chips { display: flex; gap: 8px; padding: 10px 20px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0; background: transparent; border: 0.5px solid var(--border2);
  border-radius: 20px; padding: 5px 14px; font-size: 13px; font-family: var(--sans);
  color: var(--text2); cursor: pointer; transition: all 0.15s; letter-spacing: 0.02em;
}
.chip.active { background: var(--accent); border-color: var(--accent); color: #0a0a0a; font-weight: 500; }
.chip:active { opacity: 0.7; }

/* ── Time tabs ── */
.time-wrap { flex-shrink: 0; background: var(--bg); display: flex; padding: 0 20px; gap: 0; border-bottom: 0.5px solid var(--border); }
.ttab {
  flex: 1; background: none; border: none; font-family: var(--sans); font-size: 12px;
  color: var(--text3); padding: 9px 0; cursor: pointer; letter-spacing: 0.06em;
  border-bottom: 2px solid transparent; transition: all 0.15s;
}
.ttab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* ── Content scroll ── */
.content { flex: 1; overflow-y: auto; padding: 16px 20px 100px; display: flex; flex-direction: column; gap: 12px; }
.content::-webkit-scrollbar { display: none; }

/* ── Status ── */
.status-row { display: flex; justify-content: space-between; align-items: center; padding: 2px 0 6px; }
.status-row span { font-size: 11px; color: var(--text3); letter-spacing: 0.04em; }
.verified-badge {
  display: flex; align-items: center; gap: 4px;
  background: rgba(90,173,122,0.12); color: var(--green);
  border-radius: 4px; padding: 3px 8px; font-size: 11px; letter-spacing: 0.03em;
}
.verified-badge svg { width: 11px; height: 11px; }

/* ── News card ── */
.card {
  background: var(--bg2); border: 0.5px solid var(--border);
  border-radius: 12px; padding: 16px;
  animation: fadeUp 0.3s ease both;
}
.card:active { opacity: 0.85; }
@keyframes fadeUp { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: none; } }
.card-meta { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
.sources { display: flex; gap: 5px; flex-wrap: wrap; }
.src-tag {
  font-size: 10px; color: var(--text3);
  border: 0.5px solid var(--border2); border-radius: 3px; padding: 2px 6px;
  letter-spacing: 0.03em;
}
.time-ago { font-size: 11px; color: var(--text3); white-space: nowrap; padding-left: 8px; }
.card-title {
  font-family: var(--serif); font-size: 15px; font-weight: 600;
  line-height: 1.5; color: var(--text); margin-bottom: 10px;
}
.card-summary {
  font-size: 13px; color: var(--text2); line-height: 1.75;
  margin-bottom: 14px; border-left: 2px solid var(--border2); padding-left: 10px;
}
.card-footer { display: flex; align-items: center; gap: 8px; }
.btn-speak {
  display: flex; align-items: center; gap: 5px;
  background: transparent; border: 0.5px solid var(--border2);
  border-radius: 6px; padding: 6px 12px; font-family: var(--sans);
  font-size: 12px; color: var(--text2); cursor: pointer; transition: all 0.15s;
}
.btn-speak.active { background: rgba(200,169,110,0.12); border-color: var(--accent); color: var(--accent); }
.btn-speak svg { width: 13px; height: 13px; }
.btn-link {
  display: flex; align-items: center; gap: 4px;
  background: none; border: none; font-size: 12px; color: var(--text3); cursor: pointer;
}
.btn-link svg { width: 12px; height: 12px; }
.badge-multi { margin-left: auto; font-size: 10px; background: rgba(90,173,122,0.12); color: var(--green); border-radius: 4px; padding: 3px 7px; letter-spacing: 0.03em; }
.badge-excl { margin-left: auto; font-size: 10px; background: rgba(200,169,110,0.12); color: var(--accent); border-radius: 4px; padding: 3px 7px; letter-spacing: 0.03em; }

/* ── Skeleton ── */
.skel { background: var(--bg2); border: 0.5px solid var(--border); border-radius: 12px; padding: 16px; }
.skel-line { background: var(--bg3); border-radius: 3px; animation: shimmer 1.5s ease-in-out infinite; }
@keyframes shimmer { 0%,100%{opacity:1}50%{opacity:0.4} }

/* ── Empty ── */
.empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 60px 20px; text-align: center; }
.empty-icon { font-size: 40px; color: var(--text3); }
.empty-state p { font-size: 14px; color: var(--text2); line-height: 1.6; }
.empty-state small { font-size: 12px; color: var(--text3); }

/* ── Bottom safe area ── */
.safe-bottom { height: env(safe-area-inset-bottom, 0px); background: var(--bg); flex-shrink: 0; }
</style>
</head>

    {t:'美聯準會暗示年底前降息機率增加　美股應聲上漲',s:'美國聯準會主席在國會聽證會上表示，若通膨數據持續改善，年底前降息機率將提升，消息傳出後美股三大指數同步上揚，科技股領漲，市場情緒明顯轉趨樂觀。',src:['聯合新聞網','風傳媒'],ago:'7小時前',excl:false},

    {t:'台灣羽球選手晉級世錦賽四強　創個人生涯最佳',s:'台灣羽球一哥在世界錦標賽男單比賽中擊敗世界排名第三的強敵，成功晉級四強，創下個人生涯在世錦賽最佳成績，各界給予高度肯定與期待。',src:['公視新聞'],ago:'9小時前',excl:true},

let curQ = '';
let curTime = 0;
let speakIdx = -1;

function setTime(t, btn) {
  curTime = t;
  document.querySelectorAll('.ttab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (curQ) render(curQ);
}

function quickSearch(q) {
  document.getElementById('searchInput').value = q;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.textContent === q));
  curQ = q;
  render(q);
}

function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  curQ = q;
  render(q);
}

document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

function render(q) {
  const el = document.getElementById('content');
  el.innerHTML = `
    <div class="skel"><div class="skel-line" style="height:11px;width:55%;margin-bottom:10px"></div><div class="skel-line" style="height:14px;width:90%;margin-bottom:8px"></div><div class="skel-line" style="height:12px;width:70%;margin-bottom:14px"></div><div class="skel-line" style="height:11px;width:40%"></div></div>
    <div class="skel"><div class="skel-line" style="height:11px;width:45%;margin-bottom:10px"></div><div class="skel-line" style="height:14px;width:85%;margin-bottom:8px"></div><div class="skel-line" style="height:12px;width:75%;margin-bottom:14px"></div><div class="skel-line" style="height:11px;width:35%"></div></div>
    <div class="skel"><div class="skel-line" style="height:11px;width:60%;margin-bottom:10px"></div><div class="skel-line" style="height:14px;width:80%;margin-bottom:8px"></div><div class="skel-line" style="height:12px;width:65%;margin-bottom:14px"></div><div class="skel-line" style="height:11px;width:45%"></div></div>
  `;
  setTimeout(() => buildCards(q), 800);
}

function buildCards(q) {
  const el = document.getElementById('content');
  const key = Object.keys(DB).find(k => q.includes(k));
  const arts = key ? DB[key] : fallback(q);
  const trusted = arts.filter(a => a.excl || a.src.length >= 2);
  const timeLabels = ['今天', '24小時內', '72小時內'];

  el.innerHTML = `
    <div class="status-row">
      <span>共 ${trusted.length} 則・${timeLabels[curTime]}</span>
      <div class="verified-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        可信度驗證
      </div>
    </div>
  `;

  trusted.forEach((a, i) => {
    const div = document.createElement('div');
    div.className = 'card';
    div.style.animationDelay = (i * 0.08) + 's';
    const srcHtml = a.src.slice(0,3).map(s=>`<span class="src-tag">${s}</span>`).join('') + (a.src.length>3?`<span class="src-tag">+${a.src.length-3}</span>`:'');
    const badge = a.excl ? `<span class="badge-excl">獨家</span>` : a.src.length >= 3 ? `<span class="badge-multi">多媒體驗證</span>` : '';
    div.innerHTML = `
      <div class="card-meta">
        <div class="sources">${srcHtml}</div>
        <span class="time-ago">${a.ago}</span>
      </div>
      <div class="card-title">${a.t}</div>
      <div class="card-summary">${a.s}</div>
      <div class="card-footer">
        <button class="btn-speak" id="spk-${i}" onclick="toggleSpeak(${i},\`${a.s.replace(/`/g,'')}\`)">
          <svg id="spk-icon-${i}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          語音播報
        </button>
        <button class="btn-link" onclick="window.open('https://news.google.com/search?q=${encodeURIComponent(a.t)}&hl=zh-TW','_blank')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          查原文
        </button>
        ${badge}
      </div>
    `;
    el.appendChild(div);
  });
}

function fallback(q) {
  return [
    {t:`「${q}」相關事件持續發展　各界密切關注後續動態`,s:`多家媒體報導，與「${q}」相關的最新發展引發廣泛關注，相關單位已啟動應對機制，將近日召開記者會說明最新情況，各界呼籲保持冷靜理性看待此事。`,src:['自由時報','ETtoday','三立新聞'],ago:'2小時前',excl:false},
    {t:`專家解析「${q}」背後成因　提出多項政策建議`,s:`學界與業界人士針對「${q}」議題發表評論，認為此現象反映結構性問題，並提出短中長期改善建議。相關主管機關表示將參考各方意見，研議後續配套措施。`,src:['聯合新聞網','風傳媒'],ago:'5小時前',excl:false},
    {t:`「${q}」話題持續延燒　獨家調查揭關鍵內幕`,s:`本報獨家取得相關資料，深入追蹤「${q}」議題背後的關鍵脈絡，受訪專家指出此事牽涉層面廣泛，建議主管機關應儘速啟動跨部會協調機制加以因應。`,src:['自由時報'],ago:'8小時前',excl:true},
  ];
}

let speaking = false;
function toggleSpeak(i, text) {
  if (!window.speechSynthesis) { alert('您的裝置不支援語音功能'); return; }
  const prevIdx = speakIdx;
  if (speaking) {
    window.speechSynthesis.cancel();
    speaking = false;
    setPlayBtn(prevIdx, false);
    if (prevIdx === i) { speakIdx = -1; return; }
  }
  speakIdx = i;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-TW'; u.rate = 1.0; u.pitch = 1.0;
  u.onstart = () => { speaking = true; setPlayBtn(i, true); };
  u.onend = u.onerror = () => { speaking = false; speakIdx = -1; setPlayBtn(i, false); };
  window.speechSynthesis.speak(u);
}

function setPlayBtn(i, playing) {
  const btn = document.getElementById('spk-'+i);
  const icon = document.getElementById('spk-icon-'+i);
  if (!btn || !icon) return;
  btn.classList.toggle('active', playing);
  icon.innerHTML = playing
    ? '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>'
    : '<polygon points="5 3 19 12 5 21 5 3"/>';
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
